name: Build / Release

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii", "GameCube"]
    container: devkitpro/devkitppc:latest

    steps:
    - name: Install packages
      run: |
        sudo dkp-pacman-key --recv-keys C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE --keyserver keyserver.ubuntu.com
        sudo dkp-pacman-key --lsign-key C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE
        sudo sed -i '/^\[dkp-libs\]$/,$d' /opt/devkitpro/pacman/etc/pacman.conf
        printf '%s\n' '[extremscorner-devkitpro]' 'Server = https://packages.extremscorner.org/devkitpro/linux/$arch' | sudo tee -a /opt/devkitpro/pacman/etc/pacman.conf
        sudo dkp-pacman -Sy
        sudo dkp-pacman -S --noconfirm --ask 4 gamecube-tools-git libogc2 libogc2-libdvm
    
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: |
        make -f Makefile.wii -j2
      # Don't cancel workflow if this step fails, as GameCube build may still succeed
      continue-on-error: true

    - name: Copy Wii artifacts
      if: ${{ matrix.image == 'Wii' }}
      run: |
        mkdir -p dist/GenesisPlusGX/apps/genplusgx
        mkdir -p dist/GenesisPlusGX/genplusgx/roms
        mkdir dist/GenesisPlusGX/genplusgx/cheats
        mkdir dist/GenesisPlusGX/genplusgx/saves
        touch dist/GenesisPlusGX/genplusgx/roms/romsdir
        touch dist/GenesisPlusGX/genplusgx/cheats/cheatsdir
        touch dist/GenesisPlusGX/genplusgx/saves/savesdir
        cp hbc/* dist/GenesisPlusGX/apps/genplusgx/
        cp genplus_wii.dol dist/GenesisPlusGX/apps/genplusgx/boot.dol
      continue-on-error: true

    - name: Upload Wii artifacts
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'Wii' }}
      with:
        name: GenesisPlusGX
        path: |
          dist/GenesisPlusGX/
      continue-on-error: true

    - name: Build GameCube  
      if: ${{ matrix.image == 'GameCube' }}
      run: |
        make -f Makefile.gc -j1
        
    - name: Upload GameCube artifact
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'GameCube' }}
      with:
        name: GenesisPlusGX-GameCube
        path: genplus_cube.dol


  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Re-zip artifacts
      run: |
        cd dist/GenesisPlusGX
        rm -r genplusgx/cheats/*
        rm -r genplusgx/roms/*
        rm -r genplusgx/saves/*
        zip -r ../GenesisPlusGX.zip *
        cd ../GenesisPlusGX-GameCube
        zip -r ../GenesisPlusGX-GameCube.zip *

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
